name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select semantic version increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags --force

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname | head -n 1)

          if [ -z "$latest" ]; then
            major=0
            minor=0
            patch=0
          else
            IFS='.' read -r major minor patch \
              <<< "${latest#v}"
          fi

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Invalid version increment: $BUMP"
              exit 1
              ;;
          esac

          version="v${major}.${minor}.${patch}"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Create and push Git tag
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
